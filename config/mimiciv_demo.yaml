dataset:
  name: mimic-iv-demo
  version: '2.2'            # PhysioNet project version (https://physionet.org/files/mimic-iv-demo/2.2/)
  patient:
    file: 'hosp/patients.csv.gz'
    columns: 
      - subject_id
    processor: 
      name: EHRDataFrameProcessor      
  admission:
    file: 'hosp/admissions.csv.gz'
    columns:
      - subject_id
      - hadm_id
      - admittime
      - dischtime
      - admission_type
      - admit_provider_id
      - admission_location
      - discharge_location
      - edregtime
      - edouttime
      - hospital_expire_flag
    processor:
      name: EHRDataFrameProcessor

  social: 
    file: hosp/admissions.csv.gz
    columns:
      - subject_id
      - hadm_id
      - insurance
      - language
      - marital_status
      - race
    processor:
      name: EHRDataFrameProcessor

  demographics: 
    file: hosp/patients.csv.gz
    columns:
      - subject_id
      - gender
      - anchor_age
      - anchor_year
      - anchor_year_group
      - dod
    processor:
      name: EHRDataFrameProcessor
    filters:
      - name: AgeFilter
        parameters:
          age_column: anchor_age
          age_min: 18
          age_max: 99
  diagnoses:
    file: hosp/diagnoses_icd.csv.gz
    columns:
      - subject_id
      - hadm_id
      - seq_num
      - icd_code
      - icd_version
    filters:
      - name: ICDFilter
        parameters:
          diag_column: icd_code
          icd_codes: ['4019','E785']
    processor:
      name: EHRDataFrameProcessor
  labs:
    file: hosp/labevents.csv.gz
    columns:
      - subject_id
      - hadm_id
      - itemid
      - charttime
      - value
    filters:
      - name: LabEventFilter
        parameters:
          lab_event_column: itemid
          lab_events: [50868, 50971]
    processor:
      name: EHRDataFrameProcessor

# Non-tabular modalities, added after the tables (see modules/multimodal.py).
# Records are kept if they fall within `hours` of an anchor time read from a group of the cohort.
modalities:
  ecg:
    adapter: MIMICECGAdapter
    parameters:
      source_dir: data/mimic-iv-ecg-demo   # files already there are not downloaded again
      project: mimic-iv-ecg-demo           # full data: mimic-iv-ecg, version '1.0' (open access)
      version: '0.1'
    window:
      anchor_group: admission
      anchor_time: admittime
      hours: [-12, 24]                     # ECGs are often recorded in the ED, before admittime
      # restrict_to: diagnoses             # anchor only on the admissions kept in this group
    select: all                            # all | first | last record per patient
