dataset:
  name: mimiciv
  version: '3.1'            # PhysioNet project version (https://physionet.org/files/mimiciv/3.1/)
  patient:
    file: 'hosp/patients.csv.gz'
    columns: 
      - subject_id
    processor: 
      name: EHRDataFrameProcessor      
  admission:
    file: 'hosp/admissions.csv.gz'
    columns:
      - subject_id
      - hadm_id
      - admittime
      - dischtime
      - admission_type
      - admit_provider_id
      - admission_location
      - discharge_location
      - edregtime
      - edouttime
      - hospital_expire_flag
    processor:
      name: EHRDataFrameProcessor

  social: 
    file: hosp/admissions.csv.gz
    columns:
      - subject_id
      - hadm_id
      - insurance
      - language
      - marital_status
      - race
    processor:
      name: EHRDataFrameProcessor

  demographics:
    file: hosp/patients.csv.gz
    inclusion: true   # AgeFilter restricts the whole cohort
    columns:
      - subject_id
      - gender
      - anchor_age
      - anchor_year
      - anchor_year_group
      - dod
    processor:
      name: EHRDataFrameProcessor
    filters:
      - name: AgeFilter
        parameters:
          age_column: anchor_age
          age_min: 18
          age_max: 99
  diagnoses:
    file: hosp/diagnoses_icd.csv.gz
    inclusion: true   # ICDFilter restricts the whole cohort
    columns:
      - subject_id
      - hadm_id
      - seq_num
      - icd_code
      - icd_version
    filters:
      - name: ICDFilter
        parameters:
          diag_column: icd_code
          icd_codes: ['I21*', 'I22*', '410*']   # ICD-10 acute + subsequent MI, ICD-9 AMI
    processor:
      name: EHRDataFrameProcessor
  labs:
    file: hosp/labevents.csv.gz
    columns:
      - subject_id
      - hadm_id
      - itemid
      - charttime
      - value
      - valuenum   # MIMIC-IV's pre-parsed numeric field; 'value' is free text (sometimes
                   # masked as "___" by de-identification) and must not be used for
                   # numeric computation, see scripts/mortality28d.py
    filters:
      - name: LabEventFilter
        parameters:
          lab_event_column: itemid
          # NTproBNP (50963), Hemoglobin (50811), Cholesterol (50907), Glucose (50931),
          # Creatine Kinase (50910). High-Sensitivity CRP (51652) was dropped: only ~40
          # measurements in the whole cohort, i.e. essentially never ordered on the
          # index admission (see AUDIT_zarrow.md).
          lab_events: [50963,50811,50907,50931,50910]
    processor:
      name: EHRDataFrameProcessor
